name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `next build` generates next-env.d.ts (image/CSS module types) and
      # type-checks the app, so it must run before the standalone tsc pass.
      - name: Production build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
